<template>
    <section
        class="slds-modal slds-fade-in-open"
        role="dialog"
        aria-modal="true"
        aria-labelledby="faq-import-title"
    >
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    title="Close"
                    variant="bare-inverse"
                    class="slds-modal__close"
                    onclick={handleClose}
                ></lightning-button-icon>
                <h2 id="faq-import-title" class="slds-text-heading_medium">Import FAQs from CSV</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <p class="slds-m-bottom_small">
                    Upload a UTF-8 CSV with Question, Answer, Category, and Published columns.
                    The first 10 rows are previewed before import.
                </p>
                <lightning-input
                    type="file"
                    label="CSV file"
                    accept=".csv,text/csv"
                    onchange={handleFileChange}
                ></lightning-input>
                <p class="slds-m-top_small">
                    <a href={templateDownloadUrl} download="faq-template.csv">
                        Download CSV template
                    </a>
                </p>

                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium" role="alert">
                        {errorMessage}
                    </div>
                </template>

                <template if:true={hasPreview}>
                    <h3 class="slds-text-heading_small slds-m-top_large">
                        Preview: {rowCount} rows
                    </h3>
                    <lightning-datatable
                        class="slds-m-top_small"
                        key-field="rowNumber"
                        data={previewRows}
                        columns={previewColumns}
                        hide-checkbox-column
                        aria-label="Preview of FAQ rows to import"
                    ></lightning-datatable>
                </template>

                <template if:true={importResult}>
                    <section class="slds-box slds-theme_shade slds-m-top_large" aria-live="polite">
                        <h3 class="slds-text-heading_small">Import result</h3>
                        <p class="slds-m-top_x-small">{resultSummary}</p>
                        <template if:true={hasResultWarnings}>
                            <h4 class="slds-text-title_bold slds-m-top_small">Warnings</h4>
                            <ul class="slds-list_dotted slds-m-left_large">
                                <template for:each={importResult.warnings} for:item="warning">
                                    <li key={warning}>{warning}</li>
                                </template>
                            </ul>
                        </template>
                        <template if:true={hasResultErrors}>
                            <h4 class="slds-text-title_bold slds-m-top_small">Row errors</h4>
                            <ul class="slds-list_dotted slds-m-left_large">
                                <template for:each={importResult.errors} for:item="rowError">
                                    <li key={rowError}>{rowError}</li>
                                </template>
                            </ul>
                        </template>
                    </section>
                </template>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
                <lightning-button
                    class="slds-m-left_small"
                    label="Import"
                    variant="brand"
                    onclick={handleImport}
                    disabled={disableImport}
                ></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
