<template>
    <main class="slds-p-around_large">
        <template if:true={isCheckingAccess}>
            <div class="slds-is-relative slds-p-vertical_x-large" role="status" aria-live="polite">
                <lightning-spinner alternative-text="Checking administrator access"></lightning-spinner>
            </div>
        </template>

        <template if:true={accessDenied}>
            <section class="slds-box slds-theme_alert-texture slds-theme_error" role="alert">
                <h1 class="slds-text-heading_medium">Access denied: administrators only</h1>
            </section>
        </template>

        <template if:true={isAdmin}>
            <header class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_large">
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <p class="slds-text-title_caps slds-text-color_weak">FAQ Portal</p>
                    <h1 class="slds-text-heading_large slds-m-top_x-small">FAQ Administration</h1>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-text-align_right">
                    <lightning-button
                        label="Import CSV"
                        icon-name="utility:upload"
                        onclick={handleOpenImport}
                        class="slds-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        label="New FAQ"
                        variant="brand"
                        icon-name="utility:add"
                        onclick={handleNewFaq}
                    ></lightning-button>
                </div>
            </header>

            <template if:true={message}>
                <div class={messageClass} role={messageRole} aria-live="polite">
                    {message}
                </div>
            </template>

            <section class="slds-box slds-m-bottom_medium" aria-label="FAQ filters">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                        <lightning-input
                            type="search"
                            label="Search questions"
                            value={searchInput}
                            oninput={handleSearchInput}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox
                            label="Category"
                            value={selectedCategory}
                            options={filterOptions}
                            onchange={handleCategoryChange}
                        ></lightning-combobox>
                    </div>
                </div>
            </section>

            <template if:true={isLoading}>
                <div class="slds-is-relative slds-p-vertical_large" role="status" aria-live="polite">
                    <lightning-spinner alternative-text="Loading FAQs"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasRows}>
                    <lightning-datatable
                        key-field="Id"
                        data={filteredRecords}
                        columns={columns}
                        onrowaction={handleRowAction}
                        aria-label="FAQ administration table"
                    ></lightning-datatable>
                </template>
                <template if:false={hasRows}>
                    <div class="slds-box slds-theme_shade slds-text-align_center" role="status">
                        No FAQs match these filters. Select New FAQ to create one.
                    </div>
                </template>
            </template>

            <template if:true={isFormOpen}>
                <c-faq-admin-form
                    record={selectedRecord}
                    category-options={categoryOptions}
                    onsaved={handleSaved}
                    oncancel={handleCancel}
                ></c-faq-admin-form>
            </template>
            <template if:true={isImportOpen}>
                <c-faq-csv-import onimported={handleImported} onclose={handleCloseImport}>
                </c-faq-csv-import>
            </template>
        </template>
    </main>
</template>
